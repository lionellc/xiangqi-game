<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国象棋棋谱编辑器</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="header">
        <h1>中国象棋棋谱编辑器</h1>
    </div>
    
    <!-- 文件管理区域 - 现在按钮和状态信息在同一行 -->
    <div class="file-management">
        <div class="file-management-buttons">
            <button class="btn btn-primary small-btn" id="newFileBtn">新建文件</button>
            <button class="btn btn-primary small-btn" id="openFileBtn">打开文件</button>
            <button class="btn btn-success small-btn" id="saveFileBtn">保存文件</button>
            <button class="btn btn-info small-btn" id="saveAsBtn">另存为</button>
        </div>
        <div class="file-status" id="fileStatus">未打开文件</div>
    </div>
    
    <!-- 棋局管理区域 -->
    <div class="game-management">
        <select id="gameSelect">
            <option value="">选择棋局</option>
        </select>
        <div class="game-management-buttons">
            <button class="btn btn-secondary small-btn" id="prevGameBtn">上一局</button>
            <button class="btn btn-secondary small-btn" id="nextGameBtn">下一局</button>
            <button class="btn btn-secondary small-btn" id="moveUpBtn">前移</button>
            <button class="btn btn-secondary small-btn" id="moveDownBtn">后移</button>
            <button class="btn btn-danger small-btn" id="deleteGameBtn">删除</button>
        </div>
    </div>
    
    <div class="main-container">
        <!-- 左面板：时钟和摆棋 -->
        <div class="left-panel">
            <!-- 时钟 -->
            <div class="clock-container">
                <div class="clock-title">象棋时钟</div>
                
                <!-- 时钟显示 -->
                <div class="clock-display">
                    <div class="clock-player">
                        <div class="clock-player-label">红方</div>
                        <div class="clock-time red" id="redClock">20:00</div>
                        <div class="step-time-display" id="redStepTime">步时: 01:00</div>
                    </div>
                    <div class="clock-player">
                        <div class="clock-player-label">黑方</div>
                        <div class="clock-time black" id="blackClock">20:00</div>
                        <div class="step-time-display" id="blackStepTime">步时: 01:00</div>
                    </div>
                </div>
                
                <!-- 计时规则选择 -->
                <div class="clock-rule-selector">
                    <div class="rule-option selected" data-rule="suddenDeath" onclick="selectRule('suddenDeath')">
                        <input type="radio" name="clockRule" checked> 包干制
                    </div>
                    <div class="rule-option" data-rule="increment" onclick="selectRule('increment')">
                        <input type="radio" name="clockRule"> 加秒制
                    </div>
                    <div class="rule-option" data-rule="stepTime" onclick="selectRule('stepTime')">
                        <input type="radio" name="clockRule"> 步时制
                    </div>
                </div>
                
                <!-- 时间设置 -->
                <div class="clock-setter" id="clockSettings">
                    <div class="clock-setter-group">
                        <label>红方时间(分):</label>
                        <input type="number" id="redTimeSuddenDeath" value="20" min="1" max="180">
                    </div>
                    <div class="clock-setter-group">
                        <label>黑方时间(分):</label>
                        <input type="number" id="blackTimeSuddenDeath" value="20" min="1" max="180">
                    </div>
                </div>
                
                <!-- 控制按钮 -->
                <div class="clock-control-buttons">
                    <button class="btn btn-success" id="startClockBtn">开始</button>
                    <button class="btn btn-secondary" id="pauseClockBtn">暂停</button>
                    <button class="btn btn-danger" id="resetClockBtn">重置</button>
                </div>
                
                <!-- 语音控制 -->
                <div class="voice-control">
                    <label>
                        <input type="checkbox" id="voiceToggle" checked> 语音朗读
                    </label>
                </div>
                
                <!-- 摆棋/时钟切换按钮 -->
                <button class="btn btn-secondary" id="toggleSetupModeBtn" style="margin-top:6px;padding:4px;font-size:11px;">进入摆棋</button>
            </div>
            
            <!-- 摆棋面板 -->
            <div class="setup-panel" id="setupPanel">
                <div class="setup-title">残局摆棋</div>
                <div class="piece-selector" id="pieceSelector"></div>
                <div class="clock-control-buttons">
                    <button class="btn btn-danger" id="clearBoardBtn">清空</button>
                    <button class="btn btn-success" id="startGameBtn">对弈</button>
                    <button class="btn btn-secondary" id="defaultGameBtn">开局</button>
                    <button class="btn btn-secondary" id="backToClockBtn">返回</button>
                </div>
            </div>
        </div>
        
        <!-- 棋盘区域 -->
        <div class="board-area">
            <!-- 棋盘 -->
            <div class="chess-container" id="chessContainer">
                <div class="chess-grid" id="chessGrid"></div>
            </div>
            
            <!-- 棋盘底部控制按钮 -->
            <div class="board-bottom-controls">
                <button class="btn btn-info small-btn" id="flipBoardBtn">翻转棋盘</button>
                <button class="btn btn-info small-btn" id="mirrorRecordBtn">棋谱镜像</button>
            </div>
        </div>
        
        <!-- 右面板：控制和棋谱 -->
        <div class="right-panel">
            <!-- 棋谱区域 - 占2/3宽度 -->
            <div class="record-panel">
                <div class="record-header">
                    <div class="record-title">棋谱记录</div>
                    <div id="currentMoveInfo">第0着</div>
                </div>
                <!-- 棋谱显示模式切换 -->
                <div class="view-mode">
                    <button class="btn btn-secondary" id="viewCurrentBtn" style="font-size:10px; padding:2px;">当前线路</button>
                    <button class="btn btn-secondary" id="viewFragmentsBtn" style="font-size:10px; padding:2px;">片段集合</button>
                    <button class="btn play-control-btn" id="playBtn" style="font-size:10px; padding:2px;">播放当前片段</button>
                </div>
                <div class="record-area" id="recordArea">
                    请开始对弈
                </div>
                <div class="status-info" id="gameStatusInfo">
                    显示模式：当前线路 | 当前线路：0步 | 已保存片段：0个
                </div>
            </div>
            
            <!-- 控制按钮区域 - 占1/3宽度 -->
            <div class="control-panel">
                <!-- 棋局名称输入 -->
                <input type="text" class="game-name-input" id="gameNameInput" placeholder="棋局名称" value="未命名棋局">
                
                <button class="btn btn-secondary" id="restoreGameBtn">恢复棋局</button>
                <button class="btn btn-secondary" id="copyRecordBtn">复制棋谱</button>
                <button class="btn btn-warning" id="newGameBtn">新局</button>
                <button class="btn btn-secondary" id="renameGameBtn">棋局更名</button>
                <button class="btn btn-secondary" id="undoBtn">悔棋</button>
                <button class="btn btn-secondary" id="addCommentBtn">注释</button>
                
                <!-- 新增：标记分支点按钮 -->
                <button class="btn mark-branch-btn" id="markBranchBtn">标记为分支点</button>
                
                <!-- 新增：删除分支点按钮 -->
                <button class="btn btn-danger" id="deleteBranchBtn">删除分支点</button>
                
                <!-- 新增：下划线标记按钮 -->
                <button class="btn mark-underline-btn" id="markUnderlineBtn" style="display:none;">添加下划线</button>
                
                <button class="btn btn-warning" id="branchFromHereBtn">从此变着</button>
                
                <!-- 新增：播放控制按钮 -->
                <button class="btn play-control-btn" id="playFragmentsBtn">播放所有片段</button>
                <button class="btn btn-secondary" id="stopPlayBtn">停止播放</button>
                
                <!-- 注释区域 -->
                <div class="comment-area">
                    <div style="margin-bottom:2px;">棋谱注释</div>
                    <textarea class="comment-input" id="commentInput" placeholder="输入注释..."></textarea>
                    <button class="btn btn-secondary" id="saveCommentBtn" style="margin-top:2px; width:100%; padding:3px; font-size:11px;">保存注释</button>
                    <div class="comment-display" id="commentDisplay"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 隐藏的文件输入用于打开文件 -->
    <input type="file" id="fileInput" style="display: none;" accept=".json">

    
    <script src="js/state.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/board.js"></script>
    <script src="js/record.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/game.js"></script>
    <script src="js/file.js"></script>
    <script src="js/playback.js"></script>
    <script src="js/init.js"></script>

</body>
</html>
